<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wapka API Audio Upload Tester</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            max-width: 760px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        #uploadBtn {
            background: #111827;
            color: white;
        }

        #uploadBtn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            display: none;
            white-space: pre-wrap;
        }

        .success {
            display: block;
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .info {
            display: block;
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        pre {
            margin-top: 20px;
            padding: 18px;
            background: #111827;
            color: #e5e7eb;
            border-radius: 8px;
            overflow: auto;
            font-size: 13px;
            line-height: 1.5;
        }

        .url-box {
            margin-top: 20px;
            padding: 18px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            display: none;
        }

        .url-box a {
            word-break: break-all;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }

        .note {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Wapka API Audio Upload Tester</h1>

    <p class="note">
        Test the Wapka REST API by uploading an MP3/audio file.
        Your API token is used only by this page.
    </p>

    <div class="field">
        <label for="token">Wapka API Token</label>

        <input
            type="password"
            id="token"
            placeholder="Paste your Bearer token here"
            autocomplete="off"
        >
    </div>

    <div class="field">
        <label for="folderId">Folder ID</label>

        <input
            type="number"
            id="folderId"
            value="0"
            min="0"
        >

        <p class="note">
            Use 0 for the root folder.
        </p>
    </div>

    <div class="field">
        <label for="audioFile">Audio File</label>

        <input
            type="file"
            id="audioFile"
            accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac"
        >
    </div>

    <button id="uploadBtn">
        Upload Audio
    </button>

    <div id="status" class="status"></div>

    <div id="resultBox" class="url-box">

        <strong>Returned File URL</strong>

        <p>
            <a id="fileUrl" href="#" target="_blank"></a>
        </p>

        <strong>CDN URL</strong>

        <p>
            <a id="cdnUrl" href="#" target="_blank"></a>
        </p>

        <audio
            id="audioPlayer"
            controls
            preload="metadata">
        </audio>

    </div>

    <h3>API Response</h3>

    <pre id="response">No request made yet.</pre>

</div>


<script>

const uploadBtn = document.getElementById("uploadBtn");

const tokenInput = document.getElementById("token");
const folderInput = document.getElementById("folderId");
const fileInput = document.getElementById("audioFile");

const statusBox = document.getElementById("status");
const responseBox = document.getElementById("response");

const resultBox = document.getElementById("resultBox");

const fileUrlElement = document.getElementById("fileUrl");
const cdnUrlElement = document.getElementById("cdnUrl");

const audioPlayer = document.getElementById("audioPlayer");


function showStatus(message, type) {

    statusBox.className = "status " + type;
    statusBox.textContent = message;

}


function clearResult() {

    resultBox.style.display = "none";

    fileUrlElement.textContent = "";
    fileUrlElement.href = "#";

    cdnUrlElement.textContent = "";
    cdnUrlElement.href = "#";

    audioPlayer.removeAttribute("src");
    audioPlayer.load();

}


uploadBtn.addEventListener("click", async () => {

    clearResult();

    const token = tokenInput.value.trim();
    const folderId = folderInput.value.trim();
    const file = fileInput.files[0];

    if (!token) {

        showStatus(
            "Please enter your Wapka API token.",
            "error"
        );

        return;
    }

    if (!file) {

        showStatus(
            "Please select an audio file.",
            "error"
        );

        return;
    }


    /*
     * Basic audio validation
     */

    if (
        !file.type.startsWith("audio/") &&
        !/\.(mp3|m4a|wav|ogg|aac)$/i.test(file.name)
    ) {

        showStatus(
            "Please select a valid audio file.",
            "error"
        );

        return;
    }


    const formData = new FormData();

    formData.append("file", file);
    formData.append("folderid", folderId || "0");


    uploadBtn.disabled = true;

    showStatus(
        "Uploading " + file.name + "...",
        "info"
    );

    responseBox.textContent = "Waiting for API response...";


    try {

        const response = await fetch(
            "https://api.wapka.org/v1/files/upload",
            {
                method: "POST",

                headers: {
                    "Authorization": "Bearer " + token
                },

                body: formData
            }
        );


        const text = await response.text();

        let data;

        try {

            data = JSON.parse(text);

        } catch {

            data = {
                raw_response: text
            };

        }


        responseBox.textContent =
            JSON.stringify(data, null, 2);


        if (!response.ok) {

            showStatus(
                "Upload failed.\n\nHTTP Status: " +
                response.status +
                "\n\nCheck the API response below.",
                "error"
            );

            return;
        }


        /*
         * Wapka documentation returns file metadata.
         *
         * Depending on the API response structure,
         * locate the returned file object.
         */

        const fileData =
            data.data ||
            data.file ||
            data;


        const fileUrl =
            fileData.url ||
            null;

        const cdnUrl =
            fileData.cdn_url ||
            null;


        if (fileUrl) {

            fileUrlElement.textContent = fileUrl;
            fileUrlElement.href = fileUrl;

        }


        if (cdnUrl) {

            cdnUrlElement.textContent = cdnUrl;
            cdnUrlElement.href = cdnUrl;

            /*
             * Prefer CDN URL for audio playback.
             */

            audioPlayer.src = cdnUrl;

        } else if (fileUrl) {

            audioPlayer.src = fileUrl;

        }


        if (fileUrl || cdnUrl) {

            resultBox.style.display = "block";

            showStatus(
                "Upload successful!",
                "success"
            );

        } else {

            showStatus(
                "Upload succeeded, but no file URL was found in the response.",
                "info"
            );

        }

    } catch (error) {

        responseBox.textContent =
            error.stack || error.toString();

        showStatus(
            "Request failed.\n\n" +
            error.message +
            "\n\nPossible causes:\n" +
            "• CORS restriction\n" +
            "• Network error\n" +
            "• Invalid API endpoint\n" +
            "• Invalid authentication",
            "error"
        );

    } finally {

        uploadBtn.disabled = false;

    }

});

</script>

</body>
</html>
