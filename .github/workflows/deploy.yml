name: Deploy Mekholi Lite to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (Vite MPA)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE: /Mekholi/
      - name: SPA fallback for GitHub Pages (MPA site + app)
        run: |
          touch dist/.nojekyll
          # Smart 404.html for MPA: detects /app deep links vs site, stores redirect and goes to correct entry
          cat > dist/404.html << 'EOF'
          <!doctype html><html><head><meta charset="utf-8"><title>Redirecting…</title><script>
          (function(){
            var l=window.location;
            var path=l.pathname + l.search + l.hash;
            var isApp = path.indexOf('/app') !== -1;
            var base = l.pathname.indexOf('/Mekholi/')===0 ? '/Mekholi/' : '/';
            try{ sessionStorage.setItem('gh:redirect', path); }catch(e){}
            if(isApp){
              l.replace(base + 'app.html' + l.search + l.hash);
            } else {
              l.replace(base);
            }
          })();
          </script></head><body>Redirecting…</body></html>
          EOF
          echo "dist contents:" && ls -lah dist
          echo "assets:" && ls -lah dist/assets | head -n 20
          echo "404.html:" && cat dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
