<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mekholi — দোকানের হিসাব, এখন আরও সহজ | Lite POS for Bangladesh</title>
    <meta name="description" content="Mekholi Lite — Architecture spec compliant • Supabase Auth + RLS + 7-day trial • Vanilla TS • Offline-first • Mushak 6.3" />
    <meta property="og:title" content="Mekholi — Complete Technical Blueprint" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      try{
        var t = localStorage.getItem('mekholi:theme');
        if(!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if(t==='dark') document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = t;
      }catch(e){}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
    <div id="site"></div>
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-sm font-semibold px-4 py-2.5 rounded-full shadow-xl hidden z-50"></div>
    <script type="module" src="/src/site/main.ts"></script>
  </body>
</html>
